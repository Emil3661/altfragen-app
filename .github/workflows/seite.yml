# Prüft die Logik (JavaScript und Python) und veröffentlicht danach den Ordner web/ als GitHub Pages.
# Fragen liegen nie im Repo; die Tests laufen mit synthetischen Testvektoren.
# Aufbau nach der GitHub-Vorlage: Hochladen im Job "bauen", Bereitstellen in einem eigenen Job "veroeffentlichen".
# Liegen Hochladen und Bereitstellen im selben Job, findet deploy-pages das Artefakt manchmal noch nicht.
name: Seite
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Nur eine Veröffentlichung zugleich; eine laufende wird nicht abgebrochen, sonst bleibt ein halber Stand
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: node --test tests/*.test.js
      - run: python -m unittest discover -s tests -v
  bauen:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - id: seite
        uses: actions/deploy-pages@v5
