# Prüft die Logik (JavaScript und Python) und veröffentlicht danach den Ordner web/ als GitHub Pages.
# Fragen liegen nie im Repo; die Tests laufen mit synthetischen Testvektoren.
name: Seite
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test tests/*.test.js
      - run: python -m unittest discover -s tests -v
  veroeffentlichen:
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: seite
        uses: actions/deploy-pages@v4
